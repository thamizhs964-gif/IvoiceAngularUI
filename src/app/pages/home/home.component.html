<div class="login-box">
       <h2> Login</h2>
       User Name : <input [(ngModel)]="userName" name="userName" id="userName" autocomplete="username" placeholder="User Name" />
       Password : <input [(ngModel)]="password" name="password" id="password" type="password" autocomplete="current-password" placeholder="Password" />
       <button (click)="login()">Login</button>
       <div *ngIf="isLoginSuccess === true" class="color-green">
            {{message}}
       </div>
       <div *ngIf="isLoginSuccess === false" class="color-red">
          {{message}}
       </div>
  </div>
